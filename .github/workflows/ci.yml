name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          # `cache: 'npm'` intentionally omitted — see ci-cache-safety rule.
          # Cache restore + save are explicit, with save gated on success below.

      - name: Restore npm cache
        id: cache-npm
        uses: actions/cache/restore@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node${{ matrix.node }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build grammar (yml → json)
        run: npm run build:grammar

      - name: Grammar snapshot tests
        run: npm run test:grammar

      - name: Bundle extension
        run: npm run build

      - name: Compile tests
        run: npm run compile:tests

      - name: Run unit tests
        run: npm test

      - name: Package .vsix (smoke)
        run: npx vsce package --no-update-package-json --no-git-tag-version --out modelfile-syntax-${{ matrix.os }}-node${{ matrix.node }}.vsix

      - name: Save npm cache (only on green run)
        if: success() && steps.cache-npm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.npm
          key: ${{ steps.cache-npm.outputs.cache-primary-key }}

      - name: Upload .vsix artifact (one per matrix cell)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: modelfile-syntax-vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 14
