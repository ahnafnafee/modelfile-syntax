name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build grammar (yml → json)
        run: npm run build:grammar

      - name: Grammar snapshot tests
        run: npm run test:grammar

      - name: Bundle extension
        run: npm run build

      - name: Compile tests
        run: npm run compile:tests

      - name: Run unit tests
        run: npm test

      - name: Package .vsix (smoke)
        run: npx vsce package --no-update-package-json --no-git-tag-version --out modelfile-syntax-${{ matrix.os }}-node${{ matrix.node }}.vsix

      - name: Upload .vsix artifact (one per matrix cell)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: modelfile-syntax-vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 14
