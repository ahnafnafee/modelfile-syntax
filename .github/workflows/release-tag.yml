name: release-tag

# Convenience workflow: bump package.json version, commit, tag, and push.
# The push of the v*.*.* tag then triggers `release.yml` which builds, tests,
# publishes to Marketplace + Open VSX, and creates the GitHub Release.
#
# Trigger from the GitHub UI: Actions tab → "release-tag" → "Run workflow".

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (or "custom" + custom_version)'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom version (only when bump=custom, e.g., 1.0.0-beta.1)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run (compute the next version and print it; do not commit or tag)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        run: |
          if [ "${{ inputs.bump }}" = "custom" ] && [ -z "${{ inputs.custom_version }}" ]; then
            echo "::error::bump=custom requires custom_version (e.g., 1.0.0 or 1.0.0-beta.1)."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Token must be able to push to main. Default GITHUB_TOKEN has write
          # access via the `contents: write` permission above.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          # `cache: 'npm'` intentionally omitted — see ci-cache-safety rule.
          # This workflow does no install / build, so no cache is needed.

      - name: Configure git as the actions bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute next version
        id: bump
        run: |
          if [ "${{ inputs.bump }}" = "custom" ]; then
            NEW_VERSION="${{ inputs.custom_version }}"
            # Strip leading `v` if the user added one.
            NEW_VERSION="${NEW_VERSION#v}"
          else
            CURRENT=$(node -p "require('./package.json').version")
            NEW_VERSION=$(node -e "
              const [maj, min, pat] = '$CURRENT'.split('.').map(Number);
              const bump = '${{ inputs.bump }}';
              if (bump === 'major') console.log(\`\${maj + 1}.0.0\`);
              else if (bump === 'minor') console.log(\`\${maj}.\${min + 1}.0\`);
              else console.log(\`\${maj}.\${min}.\${pat + 1}\`);
            ")
          fi
          TAG="v$NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEW_VERSION → tag $TAG"

      - name: Verify tag doesn't already exist
        run: |
          if git rev-parse "${{ steps.bump.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.bump.outputs.tag }} already exists. Pick a different version."
            exit 1
          fi

      - name: Dry-run summary
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "::notice::Dry run — would bump to ${{ steps.bump.outputs.version }} and tag ${{ steps.bump.outputs.tag }}. No commit or tag created."
          echo "## Dry run" >> "$GITHUB_STEP_SUMMARY"
          echo "Would tag: \`${{ steps.bump.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Bump package.json
        if: ${{ inputs.dry_run != true }}
        run: npm version "${{ steps.bump.outputs.version }}" --no-git-tag-version

      - name: Commit, tag, and push
        if: ${{ inputs.dry_run != true }}
        run: |
          git add package.json package-lock.json
          git commit -m "release: ${{ steps.bump.outputs.tag }}"
          git tag -a "${{ steps.bump.outputs.tag }}" -m "Release ${{ steps.bump.outputs.tag }}"
          git push origin main
          git push origin "${{ steps.bump.outputs.tag }}"

      - name: Trigger summary
        if: ${{ inputs.dry_run != true }}
        run: |
          echo "## Released" >> "$GITHUB_STEP_SUMMARY"
          echo "Tagged: \`${{ steps.bump.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "→ \`release.yml\` is now publishing to the Marketplace + Open VSX." >> "$GITHUB_STEP_SUMMARY"
          echo "→ Watch: https://github.com/${{ github.repository }}/actions/workflows/release.yml" >> "$GITHUB_STEP_SUMMARY"
