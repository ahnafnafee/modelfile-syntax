name: release-tag

# Convenience workflow: bump package.json version, commit, tag, push, and
# then directly call release.yml via workflow_call. This bypasses GitHub's
# "tags pushed by GITHUB_TOKEN don't trigger workflows" safeguard — instead
# of relying on the tag-push event to chain into release.yml, we invoke it
# explicitly in a downstream job.
#
# Trigger from the GitHub UI: Actions tab → "release-tag" → "Run workflow".

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (or "custom" + custom_version)'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom version (only when bump=custom, e.g., 1.0.0-beta.1)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run (compute the next version and print it; do not commit, tag, or publish)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      same: ${{ steps.bump.outputs.same }}
      dry_run: ${{ inputs.dry_run }}
    steps:
      - name: Validate inputs
        run: |
          if [ "${{ inputs.bump }}" = "custom" ] && [ -z "${{ inputs.custom_version }}" ]; then
            echo "::error::bump=custom requires custom_version (e.g., 1.0.0 or 1.0.0-beta.1)."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # `cache: 'npm'` intentionally omitted — see ci-cache-safety rule.

      - name: Configure git as the actions bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute next version
        id: bump
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [ "${{ inputs.bump }}" = "custom" ]; then
            NEW_VERSION="${{ inputs.custom_version }}"
            NEW_VERSION="${NEW_VERSION#v}"
          else
            NEW_VERSION=$(node -e "
              const [maj, min, pat] = '$CURRENT'.split('.').map(Number);
              const bump = '${{ inputs.bump }}';
              if (bump === 'major') console.log(\`\${maj + 1}.0.0\`);
              else if (bump === 'minor') console.log(\`\${maj}.\${min + 1}.0\`);
              else console.log(\`\${maj}.\${min}.\${pat + 1}\`);
            ")
          fi
          TAG="v$NEW_VERSION"
          if [ "$CURRENT" = "$NEW_VERSION" ]; then
            SAME=true
          else
            SAME=false
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "same=$SAME" >> "$GITHUB_OUTPUT"
          if [ "$SAME" = "true" ]; then
            echo "package.json is already at $NEW_VERSION → will tag the current HEAD without a bump commit."
          else
            echo "Next version: $CURRENT → $NEW_VERSION → tag $TAG"
          fi

      - name: Verify tag doesn't already exist
        if: ${{ inputs.dry_run != true }}
        run: |
          if git rev-parse "${{ steps.bump.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.bump.outputs.tag }} already exists. Pick a different version."
            exit 1
          fi

      - name: Dry-run summary
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "::notice::Dry run — would tag ${{ steps.bump.outputs.tag }} and publish. No commit, tag, or publish."
          {
            echo "## Dry run"
            echo "Would tag: \`${{ steps.bump.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bump package.json
        if: ${{ inputs.dry_run != true && steps.bump.outputs.same != 'true' }}
        run: npm version "${{ steps.bump.outputs.version }}" --no-git-tag-version

      - name: Commit bump (only when version actually changed)
        if: ${{ inputs.dry_run != true && steps.bump.outputs.same != 'true' }}
        run: |
          git add package.json package-lock.json
          git commit -m "release: ${{ steps.bump.outputs.tag }}"
          git push origin main

      - name: Tag and push tag
        if: ${{ inputs.dry_run != true }}
        run: |
          git tag -a "${{ steps.bump.outputs.tag }}" -m "Release ${{ steps.bump.outputs.tag }}"
          git push origin "${{ steps.bump.outputs.tag }}"

      - name: Tag summary
        if: ${{ inputs.dry_run != true }}
        run: |
          {
            echo "## Tagged \`${{ steps.bump.outputs.tag }}\`"
            echo "→ next job in this run invokes \`release.yml\` to publish."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: tag
    if: ${{ needs.tag.outputs.dry_run != 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
