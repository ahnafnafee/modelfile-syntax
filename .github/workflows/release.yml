name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  publish:
    name: build · publish · release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build grammar
        run: npm run build:grammar

      - name: Grammar snapshot tests
        run: npm run test:grammar

      - name: Bundle extension
        run: npm run build

      - name: Compile tests
        run: npm run compile:tests

      - name: Run unit tests
        run: npm test

      - name: Package .vsix
        run: npx vsce package --out modelfile-syntax.vsix

      - name: Publish to Visual Studio Marketplace
        run: npx vsce publish --packagePath modelfile-syntax.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX Registry
        run: npx ovsx publish modelfile-syntax.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: modelfile-syntax.vsix
          generate_release_notes: true
          fail_on_unmatched_files: true
