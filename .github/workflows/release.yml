name: release

# Three trigger paths converge on one publish job:
#   1. Manual `git push origin v*.*.*`            → push event
#   2. UI dispatch via Actions tab                 → workflow_dispatch event
#   3. Programmatic call from release-tag.yml      → workflow_call event
# The `tag` to publish is normalized into env.RELEASE_TAG below.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g., v0.1.0). Must already exist on the repo.'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Tag to publish (e.g., v0.1.0). Must already exist on the repo.'
        required: true
        type: string
    secrets:
      VSCE_PAT:
        required: true
      OVSX_PAT:
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: build · publish · release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          # `cache: 'npm'` intentionally omitted — see ci-cache-safety rule.

      - name: Restore npm cache
        id: cache-npm
        uses: actions/cache/restore@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node24-

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG_VERSION="$RELEASE_TAG"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build grammar
        run: npm run build:grammar

      - name: Grammar snapshot tests
        run: npm run test:grammar

      - name: Bundle extension
        run: npm run build

      - name: Compile tests
        run: npm run compile:tests

      - name: Run unit tests
        run: npm test

      - name: Package .vsix
        run: npx vsce package --out modelfile-syntax.vsix

      - name: Publish to Visual Studio Marketplace
        run: npx vsce publish --packagePath modelfile-syntax.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX Registry
        run: npx ovsx publish modelfile-syntax.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Save npm cache (only on green run)
        if: success() && steps.cache-npm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.npm
          key: ${{ steps.cache-npm.outputs.cache-primary-key }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: modelfile-syntax.vsix
          generate_release_notes: true
          fail_on_unmatched_files: true
