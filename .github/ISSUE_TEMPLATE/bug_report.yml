name: Bug report
description: Report a bug, false positive linter warning, or grammar issue.
labels: [bug]
body:
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      placeholder: 0.1.0
    validations: { required: true }
  - type: dropdown
    id: editor
    attributes:
      label: Editor
      options:
        - VSCode
        - VSCodium
        - Cursor
        - Windsurf
        - vscode.dev
        - github.dev
        - Other
    validations: { required: true }
  - type: textarea
    id: reproduction
    attributes:
      label: Modelfile content to reproduce
      description: Paste the minimum Modelfile that triggers the issue.
      render: text
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations: { required: true }
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, logs from the "Ollama Modelfile" output channel, etc.
